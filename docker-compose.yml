services:
  web:
    build: .
    container_name: antriless-web
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_USER: antriless
      DB_PASS: antriless123
      DB_NAME: db_kantin
    volumes:
      - ./baru/admin:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    container_name: antriless-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: db_kantin
      MYSQL_USER: antriless
      MYSQL_PASSWORD: antriless123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: antriless-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root123
    depends_on:
      - db

volumes:
  db_data: